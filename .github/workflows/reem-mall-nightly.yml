# Nightly Reem Mall sales feed: yesterday's (Dubai) POS sales and refunds at
# the Reem Mall location -> Vemcount. Reem Mall asked for 03:00-05:00 AM.
#
# Schedule runs only when repo variable REEM_FEED_ENABLED is "true".
# Orders tagged no-reem, or listed in reem-mall/excluded-orders.txt, are never sent.
# Manual runs: pick dry-run or send and
# optionally a date (YYYY-MM-DD) to (re)send one day; re-sending is safe.
# Secrets: DORKO_SHOPIFY_CLIENT_ID, DORKO_SHOPIFY_CLIENT_SECRET,
#          VEMCOUNT_CLIENT_ID, VEMCOUNT_CLIENT_SECRET
# Reports go to the vemcount-results branch (nightly/<date>-<mode>.json).
# With repo variable REEM_LOG_ENABLED=true, each sent day is also recorded in
# Shopify (daily log + order records) for the dashboard in the admin.
# GitHub emails the repo owner when a run fails.
name: Reem Mall nightly feed

on:
  schedule:
    # Reem Mall wants the push between 03:00 and 05:00 Dubai. GitHub starts
    # scheduled runs late here (seen: 2h to 4h30m), so the schedule is set
    # early and the job waits until 03:02 Dubai if it starts before 03:00.
    # Three tries; the first one that runs does the day, the later ones see
    # it's done and stop.
    - cron: "7 20 * * *"    # 00:07 Dubai (main)
    - cron: "37 20 * * *"   # 00:37 Dubai (backup)
    - cron: "7 21 * * *"    # 01:07 Dubai (backup)
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (show only) or send"
        required: true
        default: dry-run
        type: choice
        options: [dry-run, send]
      day:
        description: "Dubai date YYYY-MM-DD (empty = yesterday)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: reem-mall-nightly
  cancel-in-progress: false

jobs:
  feed:
    if: github.event_name == 'workflow_dispatch' || vars.REEM_FEED_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240   # includes waiting for 03:02 Dubai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for the 03:00-05:00 Dubai window
        if: github.event_name == 'schedule'
        run: |
          now=$(date -u +%s)
          target=$(date -u -d "$(TZ=Asia/Dubai date +%F) 03:02 +04:00" +%s)
          if [ "$now" -lt "$target" ]; then
            echo "Started at $(TZ=Asia/Dubai date +%H:%M) Dubai, waiting until 03:02"
            sleep $(( target - now ))
          fi
          echo "Running at $(TZ=Asia/Dubai date +%H:%M) Dubai"

      - name: Unit tests
        working-directory: reem-mall
        run: npm test

      - name: Build and send
        id: run
        working-directory: reem-mall
        env:
          DORKO_SHOP: 6zhh3e-ne.myshopify.com
          DORKO_SHOPIFY_CLIENT_ID: ${{ secrets.DORKO_SHOPIFY_CLIENT_ID }}
          DORKO_SHOPIFY_CLIENT_SECRET: ${{ secrets.DORKO_SHOPIFY_CLIENT_SECRET }}
          REEM_LOCATION_NAME: ${{ vars.REEM_LOCATION_NAME || 'Reem Mall Shop' }}
          REEM_LOG_ENABLED: ${{ vars.REEM_LOG_ENABLED || 'false' }}
          REEM_CATCHUP: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          VEMCOUNT_CLIENT_ID: ${{ secrets.VEMCOUNT_CLIENT_ID }}
          VEMCOUNT_CLIENT_SECRET: ${{ secrets.VEMCOUNT_CLIENT_SECRET }}
          VEMCOUNT_BASE_URL: ${{ vars.VEMCOUNT_BASE_URL || 'https://vemcount.app' }}
          MODE: ${{ github.event_name == 'schedule' && 'send' || inputs.mode }}
          DAY: ${{ inputs.day }}
        run: |
          # One retry after 5 minutes if the first attempt fails (Vemcount
          # can be slow). Re-sending is safe: same IDs update the same rows.
          node scripts/nightly.js "$MODE" "$DAY" "$RUNNER_TEMP/report.json" || {
            code=$?; [ "$code" = 2 ] || [ "$code" = 3 ] && exit $code
            echo "First attempt failed, retrying in 5 minutes"; sleep 300
            node scripts/nightly.js "$MODE" "$DAY" "$RUNNER_TEMP/report.json"
          }

      - name: Save report to the vemcount-results branch
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/report.json" ] || { echo "No report produced"; exit 0; }
          day=$(node -e "console.log(require(process.argv[1]).day)" "$RUNNER_TEMP/report.json")
          mode=$(node -e "console.log(require(process.argv[1]).mode)" "$RUNNER_TEMP/report.json")
          name="${day}-${mode}-$(date -u +%H%M%S).json"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch origin vemcount-results
          git switch -c vemcount-results origin/vemcount-results
          mkdir -p nightly
          cp "$RUNNER_TEMP/report.json" "nightly/$name"
          git add nightly
          git commit -q -m "Reem Mall feed report $name"
          git push -q origin vemcount-results
