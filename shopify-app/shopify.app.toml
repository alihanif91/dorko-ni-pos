# Shopify app config — source of truth for app settings. Deploy pushes this.
client_id = "8d4579a8f96bbf034a0908c76ed8ca52"
name = "Dorko NI Payments"
# Test server on Render (free plan, mock NI). Moves to the client's server at go-live.
application_url = "https://dorko-ni-pos.onrender.com"
embedded = false

[build]
include_config_on_deploy = true
# Off: `app dev` must not overwrite the deployed server URL.
automatically_update_urls_on_dev = false

[access_scopes]
# read_locations: restock refunded items at the order's POS location.
scopes = "read_orders,write_orders,read_locations"

[auth]
redirect_urls = ["https://dorko-ni-pos.onrender.com/auth/callback"]

[webhooks]
api_version = "2026-07"

[pos]
# true: lists the app under POS apps so its tile and actions can be added.
# With false, the deployed extension didn't show in POS (7-8 Oct testing).
embedded = true
